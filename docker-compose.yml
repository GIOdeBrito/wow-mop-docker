services:
    db:
        #image: mysql:8.0
        build: ./mysqlserver
        environment:
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - ./mysqlserver/init-check.sh:/docker-entrypoint-initdb.d/script1.sh
            - ./mysqlserver/0000-init.sql:/giosql/0000-init.sql
            - ./mysqlserver/data:/var/lib/mysql
        networks:
            - pandaria-network

    build:
        build: ./pandaria
        command: sleep infinity
        profiles: [ "build" ]

    authserver:
        build: ./authserver
        command: /usr/local/bin/authserver
        stdin_open: true
        tty: true
        volumes:
            - ./authserver/authserver.conf:/usr/local/etc/authserver.conf
            - ./authserver/authserver:/usr/local/bin/authserver
        networks:
            - pandaria-network
        ports:
            - "3724:3724"
        depends_on:
            - db

    worldserver:
        build: ./authserver
        command: /usr/local/bin/worldserver
        stdin_open: true
        tty: true
        volumes:
            - ./worldserver/worldserver.conf:/usr/local/etc/worldserver.conf
            - ./worldserver/playerbots.conf:/usr/local/bin/playerbots.conf
            - ./worldserver/worldserver:/usr/local/bin/worldserver
            - ./worldserver/data:/usr/local/bin/Data
        networks:
            - pandaria-network
        ports:
            - "8085:8085"
        depends_on:
            - db

    maptools:
        image: ubuntu:24.04
        command: sleep infinity
        env_file: .env
        volumes:
            - ./maptools:/maptools
            - ${WOW_DATA_FOLDER_PATH}:/client_data
        profiles: [ "maptools" ]

networks:
    pandaria-network:
